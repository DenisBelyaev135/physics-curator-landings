<script>
  // Одна ссылка на всех: случайно открываем одну из страниц сегмента (они отличаются
  // только ценой) и запоминаем выбор в браузере, чтобы при повторном заходе человек
  // увидел ту же цену. Наружу ничего не отправляется.
  (function () {
    var ids = ["L03", "L04"];
    var key = "price_g89";
    var id = null;
    try { id = localStorage.getItem(key); } catch (e) {}
    if (ids.indexOf(id) === -1) {
      id = ids[Math.floor(Math.random() * ids.length)];
      try { localStorage.setItem(key, id); } catch (e) {}
    }
    location.replace(id + "_sp.html");
  })();
</script>
